name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app (Apple silicon and Intel)
        run: ./build.sh
      - name: Verify bundle
        run: codesign --verify --strict build/Tuck.app
